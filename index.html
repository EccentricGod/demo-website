<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Demo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-box">
        <h1>Login Demo</h1>
        <p class="warning">⚠️ Website mô phỏng để học tập</p>

        <form id="loginForm">
            <label>Tên đăng nhập</label>
            <input type="text" id="username" placeholder="Nhập tên thử nghiệm">

            <label>Mật khẩu</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu giả">

            <button type="submit">Đăng nhập</button>
        </form>

        <p id="result"></p>
    </div>

    <script src="script.js"></script>

</body>
</html>
